tagline: "Latest Govt Jobs, Admit Card, Result, Answer Key — official links, auto-updated"
tagline_hi: "सरकारी नौकरी की हर सूचना, सबसे पहले"

# Apni site ka poora address (end me / mat lagana).
# Vercel par ye apne-aap Vercel ke production URL se badal jata hai.
# Apna domain lene ke baad: https://www.yourdomain.in
