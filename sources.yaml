# ==========================================================
#  OFFICIAL SOURCES — robot inhi pages se naye notices uthata hai
# ==========================================================
# Har source ke options:
#   id:        chhota unique naam (URL me use hota hai)
#   name:      poora naam (site par dikhta hai)
#   short:     short tag (UPSC, SSC ...)
#   url:       wo page jahan notices ki list hoti hai
#   region:    central / mp / delhi / up / bihar / rajasthan / haryana / cg
#   js:        true  -> page JavaScript se banta hai, headless browser se kholo
#   selector:  (optional) CSS selector — sirf is hisse ke links lo, e.g. "#news, .notice-board"
#   include:   (optional) regex — sirf matching titles lo
#   exclude:   (optional) regex — matching titles chhod do
#   default_category: (optional) agar title se category samajh na aaye
#   enabled:   false karke kisi source ko band kar sakte ho
#
# Naya source add karna ho to bas ek block copy karke URL badal do.
# Kaunsa source kaam kar raha hai, wo site ke /status/ page par dikhta hai.

sources:
  # ---------------- Central ----------------
  - id: upsc
    name: Union Public Service Commission
    short: UPSC
    url: https://upsc.gov.in/whats-new
    region: central
  - id: upsc-recruitment
    name: UPSC Recruitment
    short: UPSC
    url: https://upsc.gov.in/recruitment/recruitment-advertisement
    region: central
    default_category: latest-jobs
  - id: ssc
